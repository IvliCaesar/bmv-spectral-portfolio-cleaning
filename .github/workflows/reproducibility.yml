name: Reproducibility artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-and-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_summaries.py
      - run: python scripts/generate_figures.py
